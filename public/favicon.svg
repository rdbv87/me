<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Glow Filter Defs -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071810" />
      <stop offset="100%" stop-color="#020805" />
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#020805" />

  <!-- Outer Chip Package Border -->
  <rect x="14" y="14" width="36" height="36" rx="6" fill="url(#chipBody)" stroke="url(#emeraldGrad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Inner Core Frame -->
  <rect x="19" y="19" width="26" height="26" rx="3" fill="#04120b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />

  <!-- Top Pins -->
  <line x1="22" y1="7" x2="22" y2="14" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="7" x2="32" y2="14" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="7" x2="42" y2="14" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="22" y1="50" x2="22" y2="57" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="50" x2="32" y2="57" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="50" x2="42" y2="57" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="7" y1="22" x2="14" y2="22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="7" y1="32" x2="14" y2="32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="7" y1="42" x2="14" y2="42" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="50" y1="22" x2="57" y2="22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="32" x2="57" y2="32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="42" x2="57" y2="42" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Corner Dot Indicators (Pin 1 index mark) -->
  <circle cx="23" cy="23" r="1.5" fill="#34d399" />

  <!-- Monogram RB in Center -->
  <text x="32" y="37" font-family="'Space Grotesk', 'Fira Code', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#f0fdf4" text-anchor="middle" letter-spacing="0.5">RB</text>
</svg>
