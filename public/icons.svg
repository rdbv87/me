<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Microchip RB Icon Symbol -->
  <symbol id="chip-rb-icon" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="symChipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="50%" stop-color="#34d399" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
    </defs>
    <!-- Package Base -->
    <rect x="14" y="14" width="36" height="36" rx="6" fill="#04120b" stroke="url(#symChipGrad)" stroke-width="2.5" />
    <rect x="20" y="20" width="24" height="24" rx="3" fill="#082015" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <!-- Pins -->
    <line x1="22" y1="6" x2="22" y2="14" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="32" y1="6" x2="32" y2="14" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42" y1="6" x2="42" y2="14" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="50" x2="22" y2="58" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="32" y1="50" x2="32" y2="58" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42" y1="50" x2="42" y2="58" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="22" x2="14" y2="22" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="32" x2="14" y2="32" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="42" x2="14" y2="42" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="22" x2="58" y2="22" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="32" x2="58" y2="32" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="42" x2="58" y2="42" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="24" cy="24" r="1.5" fill="#34d399" />
    <!-- Monogram -->
    <text x="32" y="37" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#f0fdf4" text-anchor="middle" letter-spacing="0.5">RB</text>
  </symbol>
</svg>
